<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="적의 다음 수를 보고 내 행동을 고르는 짧은 전투.">
    <title>회귀탑</title>
  </head>
  <body>
    <main>
      <header>
        <h1>회귀탑</h1>
        <p id="turn"></p>
      </header>

      <section class="encounter" aria-label="전장">
        <p id="intent"></p>
        <div id="arena" aria-hidden="true"></div>
      </section>

      <div class="vitals">
        <div>
          <label for="player-hp">내 체력 <span id="player-total"></span></label>
          <meter id="player-hp" min="0" max="15" value="15"></meter>
        </div>
        <div>
          <label for="enemy-hp">적 체력 <span id="enemy-total"></span></label>
          <meter id="enemy-hp" min="0" max="23" value="23"></meter>
        </div>
      </div>

      <p id="feedback" role="status">적의 다음 수를 보고 행동을 고르세요.</p>

      <div id="actions" aria-label="행동" role="group">
        <button id="attack" type="button">공격<span>견제에 5 피해</span></button>
        <button id="guard" type="button">방어<span>강타를 막고 4 반격</span></button>
        <button id="interrupt" type="button">끊기<span>돌진을 막고 6 피해</span></button>
      </div>
      <button id="retry" type="button" hidden>같은 전투 다시 하기</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
