    <main data-screen="lobby">
      <section id="lobby" aria-labelledby="lobby-title">
        <div class="lobby-tools header-tools">
          <button id="lobby-sound" class="icon-button" type="button" aria-label="음소거" aria-pressed="false" title="음소거">
            <svg class="icon" aria-hidden="true"><use href="#icon-sound-on"/></svg>
          </button>
          <button id="lobby-guide" class="icon-button" type="button" aria-label="도감" title="도감" aria-haspopup="dialog" aria-controls="battle-guide">
            <svg class="icon" aria-hidden="true"><use href="#icon-guide"/></svg>
          </button>
          <button id="lobby-settings" class="icon-button" type="button" aria-label="설정" title="설정" aria-haspopup="dialog" aria-controls="settings">
            <svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg>
          </button>
        </div>
        <div class="lobby-scene">
          <img class="lobby-key" src="/art/lobby-key.png" alt="" width="120" height="213">
          <h1 id="lobby-title">회귀자는 <br>탑을 오른다</h1>
          <div class="lobby-actions">
            <p id="save-notice" role="status" hidden>이 등반을 이어 할 수 없습니다.</p>
            <button id="continue-ascent" class="primary lobby-start" type="button" hidden>이어 하기 <svg class="icon" aria-hidden="true"><use href="#icon-next"/></svg></button>
            <button id="new-ascent" class="lobby-start" type="button">새로 하기 <svg class="icon" aria-hidden="true"><use href="#icon-next"/></svg></button>
          </div>
        </div>
      </section>

      <header id="masthead" class="masthead" hidden>
        <div class="header-nav">
          <button id="return-lobby" class="icon-button" type="button" aria-label="로비로 돌아가기" title="로비로 돌아가기" aria-haspopup="dialog">
            <svg class="icon" aria-hidden="true"><use href="#icon-lobby"/></svg>
          </button>
          <p class="masthead-title">회귀자는 탑을 오른다</p>
        </div>
        <div class="run-status">
          <span id="map-health" role="img" hidden></span>
          <span id="map-floor" hidden></span>
          <span id="run-coins" class="coin-total" role="img" hidden></span>
          <span id="active-perk" class="sr-only" role="img" hidden></span>
          <span id="fight" hidden></span>
          <span id="turn" class="sr-only" role="img" hidden></span>
          <div class="header-tools">
            <button id="sound-toggle" class="icon-button" type="button" aria-label="음소거" aria-pressed="false" title="음소거" hidden>
              <svg class="icon" aria-hidden="true"><use href="#icon-sound-on"/></svg>
            </button>
            <button id="help" class="icon-button" type="button" aria-label="도감" title="도감" aria-haspopup="dialog" aria-controls="battle-guide" hidden>
              <svg class="icon" aria-hidden="true"><use href="#icon-guide"/></svg>
            </button>
            <button id="battle-settings" class="icon-button" type="button" aria-label="설정" title="설정" aria-haspopup="dialog" aria-controls="settings" hidden>
              <svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg>
            </button>
          </div>
        </div>
      </header>
      <div class="inventory-strip">
        <div id="reward-strip" role="group" aria-label="보유 보상" hidden></div>
        <div id="artifact-strip" role="group" aria-label="유물 세 칸" hidden></div>
      </div>

      <section id="ascent-fork" aria-labelledby="fork-heading" hidden>
        <h2 id="fork-heading">두 갈래 길</h2>
        <div id="fork-options" role="group" aria-label="다음 층 선택"></div>
      </section>

      <section id="perks" aria-labelledby="perks-heading" hidden>
        <h2 id="perks-heading">시작 특전</h2>
        <div id="perk-choices"></div>
      </section>

      <div id="battle" hidden>
        <section class="encounter" aria-label="전장">
          <div id="arena" aria-hidden="true"></div>
          <p id="intent" role="img" tabindex="0" data-hold-help></p>
          <div id="companion-flight" class="companion-tile" aria-hidden="true" hidden>
            <svg class="icon"><use href="#icon-companion-awake"/></svg>
          </div>
          <div class="combatant player">
            <output id="player-damage" class="damage-float" aria-hidden="true"></output>
            <div class="vital">
              <label for="player-hp"><svg class="icon" aria-hidden="true"><use href="#icon-heart"/></svg><span id="player-total"></span></label>
              <span class="hp-track"><meter id="player-hp" min="0" aria-label="내 체력"></meter><span class="hp-trail" aria-hidden="true"></span></span>
            </div>
          </div>
          <div class="combatant enemy">
            <output id="enemy-damage" class="damage-float" aria-hidden="true"></output>
            <div class="vital">
              <label for="enemy-hp"><svg class="icon" aria-hidden="true"><use href="#icon-heart"/></svg><span id="enemy-total"></span></label>
              <span class="hp-track"><meter id="enemy-hp" min="0" aria-label="적 체력"></meter><span class="hp-trail" aria-hidden="true"></span></span>
            </div>
          </div>
          <div class="combatant escort-damage">
            <output id="escort-damage" class="damage-float" aria-hidden="true"></output>
          </div>
          <div id="escort-guard" class="combatant escort-guard" hidden>
            <div id="escort-guard-vital" class="vital" role="img">
              <svg class="icon" aria-hidden="true"><use href="#icon-heart"/></svg><span id="escort-guard-total"></span>
            </div>
          </div>
          <p id="parry-cue" role="img" aria-label="딱 막음" hidden>
            <span aria-hidden="true"></span><svg class="icon" aria-hidden="true"><use href="#icon-parry"/></svg>
          </p>
          <ol id="hit-order" aria-label="연타 결과" hidden></ol>
          <div id="unlock-impact" class="companion-tile" aria-hidden="true" hidden>
            <svg class="icon"><use href="#icon-companion-awake"/></svg>
          </div>
          <p id="awakening" class="awakening" role="img" hidden></p>
        </section>
        <p id="feedback" class="sr-only" role="status"></p>

        <section id="planning" aria-label="주사위 배치" tabindex="-1">
          <div class="pool" data-dice-zone="pool">
            <button id="pool-help" type="button" aria-label="놓을 주사위를 여기에서 골라요." data-hold-help>
              <svg class="icon" aria-hidden="true"><use href="#icon-die"/></svg>
            </button>
            <div id="pool-dice" class="dice-row">
              <span id="locked-die" class="die unlock-hint" role="img" tabindex="0" aria-label="같은 눈 셋을 놓으면 에고 주사위가 열려요." data-hold-help>
                <svg class="icon companion-closed" aria-hidden="true"><use href="#icon-lock"/></svg>
              </span>
            </div>
            <span class="pool-return" aria-label="놓은 주사위를 클릭하거나 탭하면 배치를 빼요. 키보드로는 주사위를 고른 뒤 이 화살표를 누르세요." data-hold-help>
              <button id="assign-pool" type="button" aria-label="선택한 주사위 배치 빼기">
                <svg class="icon" aria-hidden="true"><use href="#icon-return"/></svg>
              </button>
            </span>
          </div>
          <div class="slots">
            <section class="slot" aria-label="공격 칸" data-dice-zone="attack">
              <div class="attack-heading">
                <button id="assign-attack" type="button" class="slot-target">
                  <span><svg class="icon" aria-hidden="true"><use href="#icon-sword"/></svg>공격 <span id="attack-multiplier" hidden></span></span>
                  <span class="slot-total"><strong id="attack-total">0</strong><small id="attack-bonus" class="slot-bonus" hidden></small><small id="wedge-bonus" class="slot-bonus" hidden></small></span>
                </button>
                <span id="blade-meter" role="group" tabindex="0" data-hold-help hidden>
                  <meter min="0" aria-label="큰 칼 충전"></meter>
                </span>
              </div>
              <div id="attack-dice" class="dice-row"></div>
            </section>
            <section class="slot" aria-label="방어 칸" data-dice-zone="guard">
              <button id="assign-guard" type="button" class="slot-target">
                <span><svg class="icon" aria-hidden="true"><use href="#icon-shield"/></svg>방어</span>
                <span class="slot-total"><strong id="guard-total">0</strong><small id="guard-bonus" class="slot-bonus" hidden></small></span>
              </button>
              <div id="guard-dice" class="dice-row"></div>
            </section>
          </div>

          <div class="controls">
            <button id="reroll" type="button">
              <svg class="icon" aria-hidden="true"><use href="#icon-reroll"/></svg>
              <span id="reroll-count"></span>
            </button>
            <button id="extra-reroll" type="button"></button>
            <button id="resolve" class="primary" type="button">턴 끝내기 <svg class="icon" aria-hidden="true"><use href="#icon-next"/></svg></button>
          </div>
        </section>

        <section id="counter-panel" aria-label="반격 룰렛" hidden>
          <div class="roulette-stage" role="img">
            <span class="roulette-pointer" aria-hidden="true"></span>
            <div id="counter-wheel" aria-hidden="true"></div>
          </div>
          <button id="counter" class="primary" type="button">
            <svg class="icon" aria-hidden="true"><use href="#icon-wheel"/></svg>
            <span id="counter-action">반격 룰렛</span>
          </button>
          <p id="counter-result" role="status" hidden>
            <svg class="icon" aria-hidden="true"><use href="#icon-sword"/></svg>
            <strong id="counter-damage"></strong>
          </p>
        </section>

        <section id="new-unlock" class="event-panel" aria-labelledby="unlock-heading" hidden>
          <h2 id="unlock-heading"></h2>
          <div id="unlock-reveal" role="img"></div>
          <p id="companion-awaken-line" class="companion-line" role="status" hidden></p>
        </section>

        <section id="reward-panel" aria-labelledby="reward-heading" hidden>
          <header class="reward-header">
            <h2 id="reward-heading">전투 보상</h2>
            <p id="reward-context"></p>
          </header>
          <div id="reward-cards" role="group" aria-label="보상 카드"></div>
          <p id="reward-preview" role="status" hidden></p>
          <div id="artifact-options" hidden></div>
          <div class="reward-actions">
            <button id="skip-reward" type="button">건너뛰기</button>
            <button id="confirm-reward" class="primary" type="button" disabled>확인</button>
          </div>
        </section>
        <div id="treasure-controls" role="group" aria-label="유물과 잔편 조작" hidden></div>

        <section id="ascent-event" class="event-panel" aria-label="등반 진행" hidden>
          <p id="map-rest-marker" hidden><svg class="icon" aria-hidden="true"><use href="#icon-map-rest"/></svg><span class="sr-only">정비 경유</span></p>
          <p id="event-floor" role="img"></p>
          <p id="result" role="status" hidden></p>
          <p id="completion-seal" hidden><svg class="icon" aria-hidden="true"><use href="#icon-completion-seal"/></svg>완주 인장</p>
          <p id="owned-unlocks" role="img" hidden></p>
          <p id="final-unlock" role="status" hidden></p>
          <p id="companion-sleep-line" class="companion-line" role="status" hidden></p>
          <button id="next" class="primary" type="button" hidden>다음 전투 <svg class="icon" aria-hidden="true"><use href="#icon-next"/></svg></button>
          <button id="retry" class="primary" type="button" hidden>다시 <svg class="icon" aria-hidden="true"><use href="#icon-retry"/></svg></button>
        </section>
      </div>
    </main>
    <p id="hold-help" role="tooltip" hidden></p>
    <dialog id="inventory-detail" aria-labelledby="inventory-title">
      <form method="dialog">
        <h2 id="inventory-title"></h2>
        <p id="inventory-description"></p>
        <div id="tuning-controls" role="group" aria-label="조율 잔편" hidden>
          <svg class="icon" aria-hidden="true"><use href="#icon-reward-tuning"/></svg>
          <button id="tune-down" type="button" aria-label="첫 번째 주사위 눈을 1 내리기">−1</button>
          <button id="tune-up" type="button" aria-label="첫 번째 주사위 눈을 1 올리기">+1</button>
        </div>
        <div class="confirm-actions">
          <button type="submit" value="cancel" autofocus>닫기</button>
          <button id="inventory-use" class="primary" type="submit" value="use" hidden></button>
        </div>
      </form>
    </dialog>
    <dialog id="lobby-confirm" aria-labelledby="lobby-confirm-title" aria-describedby="lobby-confirm-text">
      <form method="dialog">
        <h2 id="lobby-confirm-title"></h2>
        <p id="lobby-confirm-text"></p>
        <div class="confirm-actions">
          <button type="submit" value="cancel" autofocus>취소</button>
          <button id="lobby-confirm-action" class="primary" type="submit" value="confirm"></button>
        </div>
      </form>
    </dialog>
    <dialog id="battle-guide" aria-labelledby="guide-heading">
      <header class="guide-header">
        <h2 id="guide-heading">도감</h2>
        <form method="dialog"><button type="submit" autofocus>닫기</button></form>
      </header>
      <div id="guide-entries" tabindex="0" role="region" aria-label="아이콘 목록"></div>
    </dialog>
    <dialog id="settings" aria-labelledby="settings-title">
      <header class="guide-header">
        <h2 id="settings-title">설정</h2>
        <form method="dialog"><button type="submit" autofocus>닫기</button></form>
      </header>
      <div class="settings-list">
        <button id="settings-music" class="setting" type="button" role="switch" aria-labelledby="settings-music-label" aria-checked="true">
          <span id="settings-music-label">배경음</span><strong aria-hidden="true">켬</strong>
        </button>
        <button id="settings-effects" class="setting" type="button" role="switch" aria-labelledby="settings-effects-label" aria-checked="true">
          <span id="settings-effects-label">효과음</span><strong aria-hidden="true">켬</strong>
        </button>
        <div class="setting speed-setting" role="radiogroup" aria-labelledby="animation-speed-label">
          <span id="animation-speed-label">연출 속도</span>
          <label><input type="radio" name="animation-speed" value="normal" checked><span>보통</span></label>
          <label><input type="radio" name="animation-speed" value="fast"><span>빠름</span></label>
        </div>
        <button id="settings-motion" class="setting" type="button" role="switch" aria-labelledby="settings-motion-label" aria-checked="false">
          <span id="settings-motion-label">움직임 줄이기</span><strong aria-hidden="true">끔</strong>
        </button>
        <button id="abandon-ascent" type="button" aria-haspopup="dialog" aria-controls="lobby-confirm" hidden>등반 포기</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
