name: Stage two validation

on:
  push:
    branches: [codex/stage2]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: fc-match :lang=ko
      - run: npm run smoke -- --workers 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stage-two-smoke
          path: test-results/
