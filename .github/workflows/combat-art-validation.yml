name: Combat art validation

# Validates the combat art candidate branch on Linux. It never publishes:
# no Pages permissions, no artifact upload for deployment, no deploy step.
on:
  push:
    branches: [paseo/combat-art-20261129]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combat-art-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: echo "Validating ${GITHUB_SHA}"
      - run: npm ci
      - run: npm test
      - run: python -m pip install Pillow
      - run: python scripts/verify_art.py
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: fc-match ':family=Noto Sans CJK KR:lang=ko'
      - run: fc-match -s ':lang=ko' | head -3
      - run: npm run smoke -- --workers 2
        env:
          # Actual hero/boss scenes (including the 320 wide-forecast layout) for review.
          HWIGI_HERO_SHOTS: test-results/hero-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-art-smoke-${{ github.sha }}
          path: test-results/
          retention-days: 14
